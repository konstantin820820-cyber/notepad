name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'

      - name: Recreate platform folders
        run: flutter create --platforms=android .

      - name: Force Android 16 (API 36) via Gradle properties
        # Это официальный глобальный способ управления версиями SDK во Flutter 3.47+
        run: |
          echo "flutter.compileSdkVersion=36" >> android/gradle.properties
          echo "flutter.targetSdkVersion=36" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
